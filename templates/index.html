<!DOCTYPE html>
<html>

    <head>
        <title>Heart disease prediction</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    </head>
    <body>
        <h1>Heart disease prediction</h1>

        <form action="/predict" method="POST">
            <label>ID:</label>
            <input type="number" name="id"
            required><br><br>


        
            <label>Age (days):</label>
            <input type="number" name="age"
            required><br><br>
       
            <label>Gender:</label>
            <input type="number" name="gender"
            required><br><br>

       
            <label>Height:</label>
            <input type="number" name="height"
            required><br><br>
       
            <label>Weight:</label>
            <input type="number" name="weight"
            required><br><br>
       
            <label>Systolic BP:</label>
            <input type="number" name="ap_hi"
            required><br><br>
       
            <label>Diastolic BP:</label>
            <input type="number" name="ap_lo"
            required><br><br>

<label>Cholesterol</label>
<input type="number" name="cholesterol" 
required><br><br>
       
            <label>Glucose:</label>
            <input type="number" name="glucose"
            required><br><br>
       
            <label>Smoking:</label>
            <input type="number" name="smoke"
            required><br><br>
       
            <label>Alchol:</label>
            <input type="number" name="alco"
            required><br><br>
       
            <label>Active:</label>
            <input type="number" name="active"
            required><br><br>

            <button type="submit">predict</button>

            </form>

             {% if prediction %}
        <h2>{{ prediction }}</h2>
    {% endif %}

       
       


    </body>
</html>
